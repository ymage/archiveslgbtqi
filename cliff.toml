# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# PORTABLE BY DESIGN: this file names no repository. Drop it into any project
# unchanged. The forge URL comes from the checkout it runs against, derived by
# tagme.sh from `git remote get-url`, and reaches the template two ways:
#
#   1. CHANGELOG_REPO_URL, read by the `remote_url()` macro via get_env().
#   2. The literal placeholder <REPO>, used where Tera cannot reach —
#      link_parsers hrefs are plain config strings, not templates.
#
# tagme.sh exports (1) and substitutes (2) after rendering, so both resolve to
# the same URL. Running bare `git cliff` yourself works too, as long as you
# export CHANGELOG_REPO_URL first; without it the output carries a visible
# <REPO> rather than a wrong URL, which is the failure mode you want.
#
# NOTE: there is deliberately NO [remote.gitea] table here.
#
# git-cliff fetches the *entire* remote history (paginating /api/v1/.../commits
# and /pulls) whenever a [remote.*] table is configured and --offline is not
# passed -- regardless of --unreleased and regardless of whether the template
# even uses the data. That behaviour saturated the Forgejo git process pool and
# starved unrelated requests (CI runners polling for tasks, web UI, etc).
#
# It is also the other reason the URL is not taken from `remote.gitea.owner`:
# populating that context is exactly the code path that triggers the sweep.
#
# All contributor/author data is now derived locally from git. See tagme.sh.
# Keep this file remote-free: adding [remote.gitea] back re-enables the sweep.

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/docs/#introduction
header = """
# Changelog\n
All notable changes to this project will be documented in this file. See [conventional commits](https://www.conventionalcommits.org/) for commit guidelines.\n
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{%- macro remote_url() -%}
  {{ get_env(name="CHANGELOG_REPO_URL", default="<REPO>") }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first | trim | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
        {% if commit.author.name %} by {{ commit.author.name }}{%- endif %}\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          ({{ self::remote_url() }}/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | unique(attribute="message")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits | unique(attribute="message") %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor %}
    ### 📊 Commit Statistics

- {{ statistics.commit_count }} commit(s) contributed to the release.
- {{ statistics.commits_timespan | default(value=0) }} day(s) passed between the first and last commit.
- {{ statistics.conventional_commit_count }} commit(s) parsed as conventional.
- {{ statistics.links | length }} linked issue(s) detected in commits.
{%- if statistics.links | length > 0 %}
	{%- for link in statistics.links %}
  {{ "  " }}- [{{ link.text }}]({{ link.href }}) (referenced {{ link.count }} time(s))
	{%- endfor %}
{% endif %}
{%- if statistics.days_passed_since_last_release %}
	- {{ statistics.days_passed_since_last_release }} day(s) passed between releases.
{%- endif %}


"""
# CAREFUL: the TWO blank lines just above (before the closing """) are
# load-bearing, and one is not enough. git-cliff consumes the first one; the
# second is what produces the blank line between a release's last line and the
# next "## [" heading. With only one, releases render as:
#
#   - 0 linked issue(s) detected in commits.
#   ## [1.21.0](...)
#
# which is not a Markdown heading in strict parsers, and looks wrong everywhere.
# With none at all the two are concatenated onto a single line, which silently
# breaks both the @handle substitution and the New Contributors splice in
# tagme.sh, since both anchor on /^## \[/.
#
# For the same reason, do not document the splice with a trailing HTML comment
# inside `body`: it would become the last rendered content, leak into every
# release, and eat those separators. The "New Contributors" section is spliced
# in by tagme.sh, computed locally from `git log` rather than by paginating the
# remote PR history.

footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# An array of regex based postprocessors to modify the changelog.
#
# The <REPO> -> URL substitution used to live here, which is what pinned this
# file to one repository: `replace` is a static string with no access to the
# environment or to git. tagme.sh now performs it after rendering, from the URL
# it already derives via `git remote get-url`.
#
# Do NOT reach for `replace_command` to make this dynamic: it spawns a
# subprocess per MATCH, i.e. once per link on every line of every release. Same
# objection as the disabled `typos` preprocessor below, an order of magnitude
# worse.
postprocessors = []

#output = "CHANGELOG.md"

[bump]
features_always_bump_minor = true

# false ON PURPOSE while this project is 0.x.
#
# With `true`, ONE breaking commit takes 0.46.x straight to 1.0.0 — including a
# `chore(deps)!` or a `feat!` written on autopilot, and including one opened by
# a bot. There is no undo once that tag is pushed to the forge. With `false`, a
# breaking change on a 0.x version bumps the minor (0.46.9 → 0.47.0), which is
# what the zero-based scheme is for.
#
# Flip this to `true` in the same commit that deliberately cuts 1.0.0.
breaking_always_bump_major = false

initial_tag = "v0.1.0"

# DELIBERATELY NOT SET: no_increment_regex.
#
# It is the quieter version of the `skip = true` trap documented in
# commit_parsers below: matching commits stay visible in the changelog but stop
# moving the version, so tagme.sh reports "nothing to release" for a release
# section that plainly has content in it. If you ever add it, add the type to
# the skip list too, so the two views agree.

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
  # Turn `(#123)` in a commit message into a link. This is how PR/issue numbers
  # survive without commit.remote.pr_number: merge and squash commits already
  # carry the number in their subject line.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },

  # DISABLED: spawns a `typos` subprocess for EVERY commit message, which is a
  # significant per-run cost on a large history and hard-fails the whole run if
  # the binary is missing. Re-enable only if you actually rely on it.
  # { pattern = '.*', replace_command = 'typos --write-changes -' },
]
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from
# further processing.
#
# FIRST MATCH WINS, top to bottom. Order is behaviour, not style.
#
# READ THIS BEFORE ADDING A `skip = true`:
# skip removes the commit from the version bump as well as from the changelog.
# There is no "hide it but still count it" — git-cliff has no such lever. A
# release whose every commit is skipped yields an EMPTY unreleased section, and
# `--bumped-version` then returns the current tag with "there is nothing to
# bump". tagme.sh now names that failure explicitly (exit 2), but the cheapest
# fix is to not skip things that ship.
commit_parsers = [
  # --- Noise, skipped by AUTHOR rather than by scope -----------------------
  #
  # This replaces `{ message = "^chore\\(deps.*\\)", skip = true }`, which was
  # written for bot noise but matched by message shape. It also swallowed
  # hand-written dependency work — e.g. "chore(deps): update Go toolchain to
  # 1.26.6" — and so produced no changelog entry AND no release at all.
  #
  # Botness is a property of the author, not of the subject line. Confirm the
  # exact identities in this repo before trusting this line:
  #     git log --format='%an <%ae>' | sort -u | grep -i bot
  #
  # If your git-cliff predates `field` support in commit_parsers, fall back to
  # matching the bot's message template instead, e.g.
  #     { message = '^chore\(deps\): bump .+ from .+ to .+', skip = true },
  { field = "author.name", pattern = "(?i)^(renovate|dependabot|forgejo).*bot", skip = true },

  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(version\\):", skip = true },
  { message = "^chore\\(old\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore\\(cleanup\\):", skip = true },
  { message = "^chore\\(typo\\):", skip = true },
  { message = "^chore\\(npm\\).*yarn\\.lock", skip = true },
  { message = "^refactor\\(clippy\\)", skip = true },

  # Belt and braces: filter_unconventional = true already drops "Merge branch
  # 'x'" before any parser sees it, so these two are dead weight — kept because
  # they cost nothing and become load-bearing the day filter_unconventional is
  # turned off.
  { message = "^merge", skip = true },
  { message = "^Merging", skip = true },

  # --- Security, classified BEFORE type ------------------------------------
  #
  # `{ body = ".*security" }` used to sit below `^chore|^ci` and every type
  # rule. First match wins, so it could only fire for a commit that no earlier
  # rule claimed: it was effectively dead code for years.
  #
  # Moved up, and tightened at the same time. Plain `.*security` on the body
  # would now catch "this has no security implications" and file it under
  # Security. The pattern below requires an explicit `Security:` line in the
  # commit body, which is an opt-in marker rather than a coincidence.
  { message = "^fix\\(security\\)", group = "<!-- 8 -->🛡️ Security" },
  { message = "^feat\\(security\\)", group = "<!-- 8 -->🛡️ Security" },
  { body = '(?i)(^|\n)\s*security:', group = "<!-- 8 -->🛡️ Security" },

  # --- Deprecations, also before type --------------------------------------
  { message = "^feat\\(deprecate\\)", group = "<!-- 10 -->⚠️ Deprecated" },
  { message = "^chore\\(deprecate\\)", group = "<!-- 10 -->⚠️ Deprecated" },

  # --- Types ---------------------------------------------------------------
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐞 Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf|^improvement", group = "<!-- 4 -->⚡ Performance" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },

  # `build` is a standard conventional type and common in Go projects
  # (Dockerfile, goreleaser, Makefile). Without this line it fell through to
  # "Other", which is a group name no reader recognises.
  { message = "^build|^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },

  { message = ".*", group = "Other", default_scope = "other" },
]

# true, so that a `feat(x)!:` or a BREAKING CHANGE footer is never silently
# discarded by one of the skip rules above. Without it, a breaking dependency
# bump authored by a bot disappears from the changelog AND from the version —
# the single worst outcome this file can produce for a distributed binary.
protect_breaking_commits = true
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# Only treat vX.Y.Z tags as releases.
#
# Without this, EVERY tag is a release boundary. One `nightly`, `stable`, or a
# colleague's `wip-2026` pushed by accident silently becomes the "previous
# version" that --bumped-version and --unreleased compute against, and the next
# release's changelog covers the wrong range. Cheap insurance; costs nothing
# while nobody pushes odd tags.
tag_pattern = "v[0-9]*"
# An array of link parsers for extracting external references, and turning them
# into URLs, using regex.
#
# `href` is a plain string, not a Tera template: get_env() is unavailable here,
# so this is the field that forces the <REPO> placeholder to exist at all.
link_parsers = [
  { pattern = "#(\\d+)", href = "<REPO>/issues/$1"},
  # Absolute on purpose: an RFC is not hosted in your forge.
  { pattern = "RFC(\\d+)", text = "ietf-rfc$1", href = "https://datatracker.ietf.org/doc/html/rfc$1" },
]
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "newest"
# Process submodules commits
recurse_submodules = false
